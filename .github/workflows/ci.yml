name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  TZ: UTC
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teamflow?schema=public

jobs:
  build:
    name: Build, lint and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teamflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the database client
        # No native engine is downloaded, see ADR 0008.
        run: npm run db:generate

      - name: Build the packages
        # The API and the web app consume the compiled packages, so they are built before the
        # type check and the tests.
        run: npm run build:packages && npm run build --workspace @teamflow/api

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test --workspace @teamflow/web

      - name: Unit tests (database)
        run: npm run test --workspace @teamflow/database

      - name: Unit tests (contracts)
        run: npm run test --workspace @teamflow/contracts

      - name: Integration tests (api)
        run: npm run test --workspace @teamflow/api

      - name: Build the web application
        env:
          API_URL: http://localhost:4000
        run: npm run build --workspace @teamflow/web

  e2e:
    name: End to end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teamflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the database client
        # No native engine is downloaded, see ADR 0008.
        run: npm run db:generate

      - name: Apply the migrations
        run: npx tsx packages/database/scripts/migrate.ts

      - name: Install the browser
        # Playwright runs the headless shell in the headless mode, the full browser is needed
        # for the traces and the screenshots.
        run: |
          npx playwright install --with-deps chromium
          npx playwright install chromium-headless-shell

      - name: Build the API
        run: |
          npm run build --workspace @teamflow/contracts
          npm run build --workspace @teamflow/database
          npm run build --workspace @teamflow/api

      - name: Start the API
        env:
          SESSION_SECRET: ci-session-secret-ci-session-secret
          CORS_ORIGINS: http://localhost:3000
          COOKIE_SECURE: 'false'
        run: |
          nohup npm run start --workspace @teamflow/api > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/health/live > /dev/null; then
              echo "the api is ready"
              exit 0
            fi
            sleep 2
          done
          echo "the api did not become ready"
          cat /tmp/api.log
          exit 1

      - name: Build the web application
        env:
          API_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          npm run build --workspace @teamflow/contracts
          npm run build --workspace @teamflow/ui
          npm run build --workspace @teamflow/web

      - name: Start the web application
        env:
          API_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          nohup npm run start --workspace @teamflow/web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/login > /dev/null; then
              echo "the web application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "the web application did not become ready"
          cat /tmp/web.log
          exit 1

      - name: Run the end to end tests
        env:
          E2E_WEB_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
          E2E_SKIP_WEBSERVER: 'true'
        run: npm run test:e2e --workspace @teamflow/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  screenshots:
    name: Deterministic screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teamflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the database client
        run: npm run db:generate

      - name: Apply the migrations
        run: npx tsx packages/database/scripts/migrate.ts

      - name: Install the browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright install chromium-headless-shell

      - name: Build the API
        run: |
          npm run build --workspace @teamflow/contracts
          npm run build --workspace @teamflow/database
          npm run build --workspace @teamflow/api

      - name: Start the API
        env:
          SESSION_SECRET: ci-session-secret-ci-session-secret
          CORS_ORIGINS: http://localhost:3000
          COOKIE_SECURE: 'false'
        run: |
          nohup npm run start --workspace @teamflow/api > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/health/live > /dev/null; then
              echo "the api is ready"
              exit 0
            fi
            sleep 2
          done
          echo "the api did not become ready"
          cat /tmp/api.log
          exit 1

      - name: Build the web application
        env:
          API_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          npm run build --workspace @teamflow/contracts
          npm run build --workspace @teamflow/ui
          npm run build --workspace @teamflow/web

      - name: Start the web application
        env:
          API_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          nohup npm run start --workspace @teamflow/web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/login > /dev/null; then
              echo "the web application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "the web application did not become ready"
          cat /tmp/web.log
          exit 1

      - name: Seed deterministic fictional demo data
        run: npm run db:seed

      - name: Take the screenshots
        env:
          E2E_WEB_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
          E2E_SKIP_WEBSERVER: 'true'
          E2E_SCREENSHOTS: '1'
        run: npx playwright test --config apps/web/playwright.config.ts e2e/screenshots.spec.ts

      - name: Verify committed screenshots are current
        run: git diff --exit-code -- docs/screenshots

      - name: Upload deterministic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teamflow-screenshots-${{ github.sha }}
          path: docs/screenshots
          retention-days: 14
